name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo_guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-no-ts-nocheck.mjs
      - run: node scripts/check-js-syntax.mjs scripts

  packages_contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/contracts/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  packages_db:
    runs-on: ubuntu-latest
    needs: packages_contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/contracts/package-lock.json
            packages/db/package-lock.json
      - run: npm --prefix packages/contracts ci
      - run: npm --prefix packages/contracts run build
      - run: npm --prefix packages/db ci
      - run: npm --prefix packages/db run typecheck
      - run: npm --prefix packages/db run build

  packages_api_contracts:
    runs-on: ubuntu-latest
    needs: packages_contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/contracts/package-lock.json
            packages/api-contracts/package-lock.json
      - run: npm --prefix packages/contracts ci
      - run: npm --prefix packages/contracts run build
      - run: npm --prefix packages/api-contracts ci
      - run: npm --prefix packages/api-contracts run typecheck
      - run: npm --prefix packages/api-contracts test

  website:
    runs-on: ubuntu-latest
    needs:
      - packages_contracts
      - packages_api_contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            website/package-lock.json
            packages/contracts/package-lock.json
            packages/api-contracts/package-lock.json
      - run: npm --prefix packages/contracts ci
      - run: npm --prefix packages/contracts run build
      - run: npm --prefix packages/api-contracts ci
      - run: npm --prefix packages/api-contracts run build
      - run: npm --prefix website ci
      - run: npm --prefix website test
      - run: npm --prefix website run typecheck
      - run: npm --prefix website run lint
      - run: npm --prefix website run build

  phone_app:
    runs-on: ubuntu-latest
    needs:
      - packages_contracts
      - packages_api_contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            phone_app/package-lock.json
            packages/contracts/package-lock.json
            packages/api-contracts/package-lock.json
      - run: npm --prefix packages/contracts ci
      - run: npm --prefix packages/contracts run build
      - run: npm --prefix packages/api-contracts ci
      - run: npm --prefix packages/api-contracts run build
      - run: npm --prefix phone_app ci
      - run: npm --prefix phone_app test
      - run: npm --prefix phone_app run typecheck
      - run: npm --prefix phone_app run doctor

  cloudrun_pdf:
    runs-on: ubuntu-latest
    needs:
      - packages_contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            cloudrun-pdf/package-lock.json
            packages/contracts/package-lock.json
      - run: npm --prefix packages/contracts ci
      - run: npm --prefix packages/contracts run build
      - run: npm --prefix cloudrun-pdf ci
      - run: npm --prefix cloudrun-pdf run typecheck
      - run: npm --prefix cloudrun-pdf test

  cloudrun_archiver:
    runs-on: ubuntu-latest
    needs:
      - packages_contracts
      - packages_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            cloudrun-archiver/package-lock.json
            packages/contracts/package-lock.json
            packages/db/package-lock.json
      - run: npm --prefix packages/contracts ci
      - run: npm --prefix packages/contracts run build
      - run: npm --prefix packages/db ci
      - run: npm --prefix packages/db run build
      - run: npm --prefix cloudrun-archiver ci
      - run: npm --prefix cloudrun-archiver run typecheck
      - run: npm --prefix cloudrun-archiver test

  cloudrun_api:
    runs-on: ubuntu-latest
    needs:
      - packages_contracts
      - packages_api_contracts
      - packages_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/contracts/package-lock.json
            packages/api-contracts/package-lock.json
            packages/db/package-lock.json
            cloudrun-api/package-lock.json
      - run: npm --prefix packages/contracts ci
      - run: npm --prefix packages/contracts run build
      - run: npm --prefix packages/api-contracts ci
      - run: npm --prefix packages/api-contracts run build
      - run: npm --prefix packages/db ci
      - run: npm --prefix packages/db run build
      - run: npm --prefix cloudrun-api ci
      - run: npm --prefix cloudrun-api run typecheck
      - run: npm --prefix cloudrun-api test

  cloudrun_tax:
    runs-on: ubuntu-latest
    needs:
      - packages_contracts
      - packages_api_contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/contracts/package-lock.json
            packages/api-contracts/package-lock.json
            cloudrun-tax/package-lock.json
      - run: npm --prefix packages/contracts ci
      - run: npm --prefix packages/contracts run build
      - run: npm --prefix packages/api-contracts ci
      - run: npm --prefix packages/api-contracts run build
      - run: npm --prefix cloudrun-tax ci
      - run: npm --prefix cloudrun-tax run typecheck
      - run: npm --prefix cloudrun-tax test

  supabase_edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase edge runtime
        run: |
          shopt -s globstar
          deno check --config deno.json supabase/shared-edge-helpers.ts supabase/functions/**/*.ts supabase/handlers/**/*.ts
      - name: Run Supabase hardening tests
        run: |
          deno test --config deno.json \
            --allow-read="$GITHUB_WORKSPACE/supabase,$GITHUB_WORKSPACE/packages/db/migrations" \
            supabase/handlers/handlers-hardening.test.ts

  perf_budget:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check performance budget
        run: node scripts/check-perf-budget.mjs

  cloudrun_images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build main API image
        run: docker build -f cloudrun-api/Dockerfile -t smart-job-cloudrun-api:ci .
      - name: Build tax gateway image
        run: docker build -f cloudrun-tax/Dockerfile -t smart-job-cloudrun-tax:ci .
      - name: Build PDF service image
        run: docker build -f cloudrun-pdf/Dockerfile -t smart-job-cloudrun-pdf:ci .
      - name: Build archiver image
        run: docker build -f cloudrun-archiver/Dockerfile -t smart-job-cloudrun-archiver:ci .

  integration_tests:
    runs-on: ubuntu-latest
    needs:
      - packages_contracts
      - packages_api_contracts
      - packages_db
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55322/postgres
      DATABASE_SSL_MODE: disable
      SMART_JOB_TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55322/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.104.0
      - name: Start isolated Supabase services
        run: supabase start
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/contracts/package-lock.json
            packages/api-contracts/package-lock.json
            packages/db/package-lock.json
            cloudrun-api/package-lock.json
      - run: npm --prefix packages/contracts ci
      - run: npm --prefix packages/contracts run build
      - run: npm --prefix packages/api-contracts ci
      - run: npm --prefix packages/api-contracts run build
      - run: npm --prefix packages/db ci
      - run: npm --prefix packages/db run build
      - name: Apply database migrations
        run: npm --prefix packages/db run db:migrate
      - name: Run database integration tests
        run: npm --prefix packages/db run test:integration
      - run: npm --prefix cloudrun-api ci
      - name: Build cloudrun-api
        run: npm --prefix cloudrun-api run build
      - name: Run cloudrun-api integration tests
        run: node --test dist/tests/*.integration.test.js
        working-directory: cloudrun-api
      - name: Stop isolated Supabase services
        if: always()
        run: supabase stop --no-backup

  website_e2e:
    if: ${{ vars.RUN_WEBSITE_E2E == 'true' }}
    runs-on: ubuntu-latest
    needs:
      - website
    env:
      PLAYWRIGHT_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            website/package-lock.json
            packages/contracts/package-lock.json
            packages/api-contracts/package-lock.json
      - run: npm --prefix packages/contracts ci
      - run: npm --prefix packages/contracts run build
      - run: npm --prefix packages/api-contracts ci
      - run: npm --prefix packages/api-contracts run build
      - run: npm --prefix website ci
      - run: npm --prefix website run build
      - name: Install Playwright browsers
        run: npx --prefix website playwright install --with-deps chromium
      - name: Run Playwright E2E tests
        run: npm --prefix website run test:e2e
