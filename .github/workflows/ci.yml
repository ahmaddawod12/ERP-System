      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm test

  cloudrun_pdf:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudrun-pdf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudrun-pdf/package-lock.json
      - run: npm ci
      - run: npm test

  cloudrun_archiver:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudrun-archiver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudrun-archiver/package-lock.json
      - run: npm ci
      - run: npm test
