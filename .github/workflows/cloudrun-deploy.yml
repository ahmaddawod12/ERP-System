name: Cloud Run Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production
      image_tag:
        description: Exact 40-character commit SHA (must match the selected workflow ref)
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  release_preflight:
    name: Verify immutable release identity and successful CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require the selected commit SHA
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          [[ "${IMAGE_TAG}" =~ ^[0-9a-f]{40}$ ]]
          test "${IMAGE_TAG}" = "${GITHUB_SHA}"
      - name: Require a successful CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SUCCESS_COUNT="$(gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=completed&per_page=100" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
          test "${SUCCESS_COUNT}" -gt 0

  deploy_api:
    name: Deploy main API to Cloud Run
    runs-on: ubuntu-latest
    needs: release_preflight
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Authorize Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Configure production Cloud Armor throttles
        if: inputs.environment == 'production'
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          CLOUD_ARMOR_POLICY: ${{ vars.CLOUD_ARMOR_POLICY }}
          CLOUD_ARMOR_BACKEND_SERVICES: ${{ vars.WEBSITE_BACKEND_SERVICE }},${{ vars.API_BACKEND_SERVICE }}
        run: bash scripts/configure-cloud-armor.sh

      - name: Build and push main API image
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}/cloudrun-api:${{ inputs.image_tag }}"
          docker build \
            -f cloudrun-api/Dockerfile \
            -t "${IMAGE}" \
            .
          docker push "${IMAGE}"
          DIGEST="$(gcloud artifacts docker images describe "${IMAGE}" --format='value(image_summary.digest)')"
          test -n "${DIGEST}"
          echo "API_IMAGE_DIGEST=${IMAGE%:*}@${DIGEST}" >> "${GITHUB_ENV}"

      - name: Keyless-sign main API image digest
        run: cosign sign --yes "${API_IMAGE_DIGEST}"

      - name: Verify main API image signature
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\\.github/workflows/cloudrun-deploy\\.yml@refs/.+$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${API_IMAGE_DIGEST}"

      - name: Deploy main API to Cloud Run
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          INGRESS_FLAG="--ingress=all"
          if [[ "${DEPLOY_ENVIRONMENT}" == "production" ]]; then
            INGRESS_FLAG="--ingress=internal-and-cloud-load-balancing"
          fi
          gcloud run deploy cloudrun-api \
            --image "${API_IMAGE_DIGEST}" \
            --region ${{ vars.GCP_REGION }} \
            --service-account ${{ vars.CLOUDRUN_API_SERVICE_ACCOUNT }} \
            --min-instances ${{ vars.API_MIN_INSTANCES }} \
            --max-instances ${{ vars.API_MAX_INSTANCES }} \
            --concurrency ${{ vars.API_CONCURRENCY }} \
            --timeout 30 \
            "${INGRESS_FLAG}" \
            --allow-unauthenticated \
            --set-secrets DATABASE_URL=smart-job-api-database-url:latest,SUPABASE_URL=smart-job-supabase-url:latest,SUPABASE_PUBLISHABLE_KEY=smart-job-supabase-publishable-key:latest,SUPABASE_SECRET_KEY=smart-job-supabase-secret-key:latest,SUPABASE_STORAGE_BUCKET=smart-job-storage-bucket:latest,WEB_SESSION_ENCRYPTION_KEY_BASE64=smart-job-web-session-key:latest,WEB_SESSION_ENCRYPTION_KEY_VERSION=smart-job-web-session-key-version:latest,INTERNAL_API_AUDIENCE=smart-job-internal-audience:latest,INTERNAL_CALLER_SERVICE_ACCOUNTS=smart-job-internal-callers:latest \
            --set-env-vars DATABASE_SSL_MODE=require,SUPABASE_JWT_AUDIENCE=authenticated,NODE_ENV=production,LOG_LEVEL=info,ARCHIVE_BUCKET=${{ vars.ARCHIVE_BUCKET }},DOCUMENT_PUBSUB_PROJECT_ID=${{ vars.GCP_PROJECT_ID }},DOCUMENT_PREVIEW_TOPIC=${{ vars.DOCUMENT_PREVIEW_TOPIC }},DOCUMENT_GENERATE_TOPIC=${{ vars.DOCUMENT_GENERATE_TOPIC }},EMAIL_DELIVERY_TOPIC=${{ vars.EMAIL_DELIVERY_TOPIC }}

      - name: Output main API URL
        run: |
          API_URL="$(gcloud run services describe cloudrun-api \
            --region ${{ vars.GCP_REGION }} \
            --format='value(status.url)')"
          echo "Main API deployed to ${API_URL}"

  deploy_tax:
    name: Deploy tax gateway to Cloud Run (me-west1)
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    needs: deploy_api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Authorize Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_TAX_REGION }}-docker.pkg.dev" --quiet

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Build and push tax gateway image
        run: |
          IMAGE="${{ vars.GCP_TAX_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}/cloudrun-tax:${{ inputs.image_tag }}"
          docker build \
            -f cloudrun-tax/Dockerfile \
            -t "${IMAGE}" \
            .
          docker push "${IMAGE}"
          DIGEST="$(gcloud artifacts docker images describe "${IMAGE}" --format='value(image_summary.digest)')"
          test -n "${DIGEST}"
          echo "TAX_IMAGE_DIGEST=${IMAGE%:*}@${DIGEST}" >> "${GITHUB_ENV}"

      - name: Keyless-sign tax gateway image digest
        run: cosign sign --yes "${TAX_IMAGE_DIGEST}"

      - name: Verify tax gateway image signature
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\\.github/workflows/cloudrun-deploy\\.yml@refs/.+$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${TAX_IMAGE_DIGEST}"

      - name: Deploy tax gateway to Cloud Run
        run: |
          gcloud run deploy cloudrun-tax \
            --image "${TAX_IMAGE_DIGEST}" \
            --region ${{ vars.GCP_TAX_REGION }} \
            --service-account ${{ vars.CLOUDRUN_TAX_SERVICE_ACCOUNT }} \
            --min-instances ${{ vars.TAX_MIN_INSTANCES }} \
            --max-instances ${{ vars.TAX_MAX_INSTANCES }} \
            --concurrency 8 \
            --timeout 30 \
            --allow-unauthenticated \
            --set-secrets TAX_TOKEN_URL=smart-job-tax-token-url:latest,TAX_APPROVAL_URL=smart-job-tax-approval-url:latest,TAX_CLIENT_ID=smart-job-tax-client-id:latest,TAX_CLIENT_SECRET=smart-job-tax-client-secret:latest,TAX_CALLBACK_HMAC_SECRET=smart-job-tax-callback-hmac:latest,MAIN_API_URL=smart-job-tax-main-api-url:latest,MAIN_API_AUDIENCE=smart-job-tax-main-api-audience:latest,TAX_GATEWAY_AUDIENCE=smart-job-tax-gateway-audience:latest,TAX_APPROVAL_CALLER_SERVICE_ACCOUNT=smart-job-tax-approval-caller:latest \
            --set-env-vars NODE_ENV=production,LOG_LEVEL=info

  deploy_pdf:
    name: Deploy PDF service to Cloud Run
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    needs: deploy_api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Authorize Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Build and push PDF service image
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}/cloudrun-pdf:${{ inputs.image_tag }}"
          docker build \
            -f cloudrun-pdf/Dockerfile \
            -t "${IMAGE}" \
            .
          docker push "${IMAGE}"
          DIGEST="$(gcloud artifacts docker images describe "${IMAGE}" --format='value(image_summary.digest)')"
          test -n "${DIGEST}"
          echo "PDF_IMAGE_DIGEST=${IMAGE%:*}@${DIGEST}" >> "${GITHUB_ENV}"

      - name: Keyless-sign PDF service image digest
        run: cosign sign --yes "${PDF_IMAGE_DIGEST}"

      - name: Verify PDF service image signature
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\\.github/workflows/cloudrun-deploy\\.yml@refs/.+$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${PDF_IMAGE_DIGEST}"

      - name: Deploy PDF service to Cloud Run
        run: |
          gcloud run deploy cloudrun-pdf \
            --image "${PDF_IMAGE_DIGEST}" \
            --region ${{ vars.GCP_REGION }} \
            --service-account ${{ vars.CLOUDRUN_PDF_SERVICE_ACCOUNT }} \
            --min-instances 0 \
            --max-instances 3 \
            --concurrency 4 \
            --timeout 60 \
            --no-allow-unauthenticated \
            --set-secrets SUPABASE_URL=smart-job-supabase-url:latest,SUPABASE_SECRET_KEY=smart-job-supabase-secret-key:latest \
            --set-env-vars PUPPETEER_EXECUTABLE_PATH=/usr/bin/google-chrome-stable,SUPABASE_STORAGE_BUCKET=smart-job-company-files,NODE_ENV=production

  deploy_archiver:
    name: Deploy archiver job to Cloud Run
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    needs: deploy_api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Authorize Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Build and push archiver image
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}/cloudrun-archiver:${{ inputs.image_tag }}"
          docker build \
            -f cloudrun-archiver/Dockerfile \
            -t "${IMAGE}" \
            .
          docker push "${IMAGE}"
          DIGEST="$(gcloud artifacts docker images describe "${IMAGE}" --format='value(image_summary.digest)')"
          test -n "${DIGEST}"
          echo "ARCHIVER_IMAGE_DIGEST=${IMAGE%:*}@${DIGEST}" >> "${GITHUB_ENV}"

      - name: Keyless-sign archiver image digest
        run: cosign sign --yes "${ARCHIVER_IMAGE_DIGEST}"

      - name: Verify archiver image signature
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\\.github/workflows/cloudrun-deploy\\.yml@refs/.+$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${ARCHIVER_IMAGE_DIGEST}"

      - name: Deploy archiver as Cloud Run Job
        run: |
          gcloud run jobs deploy cloudrun-archiver \
            --image "${ARCHIVER_IMAGE_DIGEST}" \
            --region ${{ vars.GCP_REGION }} \
            --service-account ${{ vars.CLOUDRUN_ARCHIVER_SERVICE_ACCOUNT }} \
            --tasks 1 \
            --task-timeout 60m \
            --max-retries 2 \
            --set-secrets DATABASE_URL=smart-job-archiver-database-url:latest,SUPABASE_URL=smart-job-supabase-url:latest,SUPABASE_SECRET_KEY=smart-job-supabase-secret-key:latest \
            --set-env-vars DATABASE_SSL_MODE=require,NODE_ENV=production,SMART_JOB_PERSISTENCE_BACKEND=sql,ARCHIVE_BUCKET=${{ vars.ARCHIVE_BUCKET }},ARCHIVER_QUERY_PAGE_SIZE=500,ARCHIVER_COMPANY_CONCURRENCY=2,ARCHIVER_LEASE_SECONDS=3600,ARCHIVER_JOB_DEADLINE_MS=3300000,ARCHIVER_CANDIDATE_LIMIT=2000
