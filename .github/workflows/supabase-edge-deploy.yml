name: Supabase Edge Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment label"
        required: true
        default: "production"
      dry_run:
        description: "If true, print function mapping without deploying"
        required: true
        default: "false"

jobs:
  deploy_supabase_edge:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate deploy secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is required"
            exit 1
          fi
          if [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "SUPABASE_PROJECT_ID is required"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Prepare flattened function folders
        run: |
          set -euo pipefail
          cp -R supabase/functions/contact/request supabase/functions/contact-request
          cp -R supabase/functions/invites/create supabase/functions/invites-create
          cp -R supabase/functions/invites/join supabase/functions/invites-join
          cp -R supabase/functions/upgrades/request supabase/functions/upgrades-request
          cp -R supabase/functions/upgrades/list supabase/functions/upgrades-list
          cp -R supabase/functions/upgrades/moderate supabase/functions/upgrades-moderate
          cp -R supabase/functions/tax/callback supabase/functions/tax-callback

      - name: Deploy edge functions
        run: |
          set -euo pipefail
          FUNCTIONS=(
            mutation-gateway
            mutation-gateway-me-west1
            read-model
            contact-request
            invites-create
            invites-join
            upgrades-request
            upgrades-list
            upgrades-moderate
            tax-callback
          )

          echo "Supabase project: $SUPABASE_PROJECT_ID"
          echo "Functions: ${FUNCTIONS[*]}"

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run enabled. Skipping deploy commands."
            exit 0
          fi

          for fn in "${FUNCTIONS[@]}"; do
            echo "Deploying $fn"
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_ID"
          done
