appId: ${MAESTRO_APP_ID}
---
- launchApp:
    clearState: false
- waitForAnimationToEnd
- tapOn:
    id: "workspace-selector"
- assertVisible:
    text: ".*Select.*|.*Company.*"
- tapOn:
    index: 0
    id: "workspace-option"
- waitForAnimationToEnd
- assertVisible:
    text: ".*Dashboard.*|.*Home.*|.*Overview.*"
